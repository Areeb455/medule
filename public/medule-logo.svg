<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Medule Signature Teal-to-Cyan Gradient matching website index.css -->
    <linearGradient id="meduleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#199e8c" />
      <stop offset="50%" stop-color="#149ebf" />
      <stop offset="100%" stop-color="#11a4d4" />
    </linearGradient>

    <!-- Subtle inner specular lighting -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern App Icon Squircle Container -->
  <rect width="512" height="512" rx="118" fill="url(#meduleGradient)" />
  <rect width="512" height="512" rx="118" fill="url(#gloss)" />

  <!-- Subtle ambient pulse ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.15" stroke-dasharray="12 12" />

  <!-- Exact Lucide Activity Waveform matching Medule Website Navbar & Footer -->
  <polyline
    points="75 256, 160 256, 218 410, 310 102, 362 256, 437 256"
    fill="none"
    stroke="#ffffff"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Apex and nadir indicator dots -->
  <circle cx="310" cy="102" r="14" fill="#ffffff" opacity="0.9" />
  <circle cx="218" cy="410" r="12" fill="#ffffff" opacity="0.9" />
</svg>
