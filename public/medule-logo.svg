<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="meduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />
  <!-- Pulse glow ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" stroke-dasharray="8 8" />
  <!-- Medical cross with heartbeat line -->
  <path d="M216 110 H296 V216 H402 V296 H296 V402 H216 V296 H110 V216 H216 Z" fill="url(#meduleGrad)" opacity="0.15" />
  <!-- Ecg Line -->
  <path d="M120 256 H190 L220 170 L256 340 L290 200 L320 290 L345 256 H392" 
        fill="none" 
        stroke="url(#meduleGrad)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  <!-- Central Pulse Dots -->
  <circle cx="256" cy="340" r="10" fill="#38bdf8" />
  <circle cx="220" cy="170" r="10" fill="#38bdf8" />
</svg>
